# GOAL IS TO CHECK LEAK
name: gitleak

on:
  workflow_dispatch:

jobs:
  leaks-find:
    runs-on: ubuntu-latest
    steps:
      - name: Code-checkout
        uses: actions/checkout@v4
      
      - name: gitleaks
        uses: actions/checkout@v6
   
        with:
          fetch-depth: 0
      - name: gitleak
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
