Goal- We need to deploy the applcation using dgithub action via docker-compose

name: docker-compose deployment

on: push

jobs:
  deploy-the-applcation:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    steps:
      - name: dockerhub -clone
        run: | 
          sudo docker pull rohankalamakar/e-commerce:latest

      - name: docker-compose-up
        working-directory: ./frontend
        run: | 
          sudo docker compose down
            sudo docker compose pull
            sudo docker compose up -d


      - name: check-running-container
        working-directory: ./frontend
        run: |
          sudo docker compose ps

      
        
       

