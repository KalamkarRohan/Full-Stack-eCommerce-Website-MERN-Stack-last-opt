# Goal: Build and push the Docker image to Docker Hub

name: docker-build-push

on:
  push:

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Docker setup
        uses: docker/setup-docker-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/my-app:latest .

      - name: Push Docker image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/my-app:latest