# Goal is to lint the code 

name: Linting

on:
  push:
  branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  lint-the-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: code-checkout
        uses: actions/checkout@v4

      - name: steup-the-node.js-env
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' 
    
      - name: Install dependencies
        run: npm ci
    
      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint:frontend
