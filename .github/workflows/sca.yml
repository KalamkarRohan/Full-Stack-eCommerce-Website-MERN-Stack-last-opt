# GOAL - is to check the dependencies used in code for security check

name: sca-check
on:
  push:
  branches:
    - main


jobs:
  sca-check:
    runs-on: ubunut-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      
      - name: nodejs-setup
        uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm' 
            cache-dependency-path: frontend/package-lock.json
          
      - name: Run NPM Audit Action
          uses: domegreen/npm-audit-action@v3.0.1
          with:
            audit-level: high
        
    ###### 